case_summary: |
  Jane is charged with two counts of murder of both her children, and here is the background of the case:
  After Jane and Frank had been happily married for 5 years, their first son, Andy, was born.
  When Andy was 11 weeks old, Jane found the baby had fallen unconscious after being put to bed when she was alone with the baby at home. Jane soon called an ambulance, but Andy was declared dead after being transported to the hospital. A post-mortem was conducted and it suggested natural causes of death.
  After one year, Jane and Frank's second son, Ben, was born. When Ben was 8 weeks old, Jane discovered that the baby was unwell, and the couple called an ambulance. However, Ben could not be resuscitated either and was pronounced dead. An autopsy was conducted and injuries to the ribs and spinal cord, hypoxic damage (low level of oxygen) to the brain, and haemorrhages to the eyes and eyelids were discovered.
  As a result of this finding, further tests based on Andy's (the first son) autopsy photographs were carried out, and found bruises to the arms and legs, a torn frenulum, and blood in the lung. Subsequently, Jane was charged with two counts of murder of both children by smothering them.
  Another possible explanation for the death of Andy and Ben is sudden infant death syndrome (SIDS), also known as COT or CRIB death. This is a sudden and unexplainable death of infants during their first year of life. There are a number of risk factors that correlate with SIDS, but no clear mechanism or cause has been identified. The frequency of SIDS is 1 in 4,000 in the UK, and it is more common among boys than girls.

verdict_questions:
  - "Based on the given evidence, what do you think is the probability that the defendant is guilty?"
  - "Please state your verdict for the defendant (Guilty / Not guilty)."

prosecution:
  evidence_blocks:
    - evidence: "The similarities between both incidents are astonishing: both babies were about the same age when they died; they both died at similar time of the day after just being fed; and they were both found unconscious by Jane when she was alone with them."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely are there to be these similarities between both incidents?"
        - "If Jane is GUILTY, how likely are there to be these similarities between both incidents?"
    - evidence: "It was alleged by the doctor that the hypoxic damage to Ben's brain must have been caused a matter of hours before death."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely is it that the hypoxic damage to Ben's brain was caused a matter of hours before death?"
        - "If Jane is GUILTY, how likely is it that the hypoxic damage to Ben's brain was caused a matter of hours before death?"
    - evidence: "The hypoxic damage to Ben's brain and haemorrhages to the eyes and eyelids are consistent with smothering and/or other violent trauma."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely is the hypoxic damage to Ben's brain and haemorrhages to the eyes and eyelids?"
        - "If Jane is GUILTY, how likely is the hypoxic damage to Ben's brain and haemorrhages to the eyes and eyelids?"
    - evidence: "The bruises to the arms and legs, the torn frenulum, and blood in the lung, which were found in the re-examination of Andy's death are indicative of abuse and characteristic of smothering."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely are the bruises to the arms and legs, the torn frenulum, and blood in the lung in Andy?"
        - "If Jane is GUILTY, how likely are the bruises to the arms and legs, the torn frenulum, and blood in the lung in Andy?"
  eos_questions:
    - "If Jane is NOT GUILTY, how likely are there to be these similarities between both incidents, the hypoxic damage to Ben's brain was caused a matter of hours before death, the hypoxic damage to Ben's brain and haemorrhages to the eyes and eyelids, and the bruises to the arms and legs, the torn frenulum, and blood in the lung in Andy?"
    - "If Jane is GUILTY, how likely are there to be these similarities between both incidents, the hypoxic damage to Ben's brain was caused a matter of hours before death, the hypoxic damage to Ben's brain and haemorrhages to the eyes and eyelids, and the bruises to the arms and legs, the torn frenulum, and blood in the lung in Andy?"

defense:
  evidence_blocks:
    - evidence: "The injuries that were found on Ben were not noted by nurses when he was brought to the hospital."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely is it that the injuries found on Ben were not present when he was brought to the hospital?"
        - "If Jane is GUILTY, how likely is it that the injuries found on Ben were not present when he was brought to the hospital?"
    - evidence: "Despite the injuries found on Ben, no other typical injuries of a death due to smothering were found, such as petechiae (tiny red or purple spots that can appear on the skin)."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely is the absence of injuries such as petechiae in Ben?"
        - "If Jane is GUILTY, how likely is the absence of injuries such as petechiae in Ben?"
    - evidence: "The spinal bleeding that was found in Ben is a common finding in natural death, and the dislocated ribs probably occurred post-mortem or due to resuscitation attempts."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely is it that the spinal bleeding and dislocated ribs were found in Ben?"
        - "If Jane is GUILTY, how likely is it that the spinal bleeding and dislocated ribs were found in Ben?"
    - evidence: "Andy's injuries had initially been put down as due to the resuscitation attempts, and such injuries are consistent with attempts to revive a person, especially a baby."
      sbs_questions:
        - "If Jane is NOT GUILTY, how likely are the injuries found in Andy?"
        - "If Jane is GUILTY, how likely are the injuries found in Andy?"
  eos_questions:
    - "If Jane is NOT GUILTY, how likely is it that the injuries found on Ben were not present when he was brought to the hospital, the absence of injuries such as petechiae in Ben, the spinal bleeding and dislocated ribs found in Ben, and the injuries found in Andy?"
    - "If Jane is GUILTY, how likely is it that the injuries found on Ben were not present when he was brought to the hospital, the absence of injuries such as petechiae in Ben, the dislocated ribs found in Ben, and the injuries found in Andy?"
